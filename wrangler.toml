# Cloudflare Workers 配置（wrangler.toml）
# wrangler 是 Cloudflare 的命令行工具，用这个文件声明 Worker 的绑定（KV/D1/R2）和定时任务
name = "yiquantea-api"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# ★定时任务（Cron Triggers）
[triggers]
crons = [
  "0 19 * * *",   # 每天 UTC 19:00 = 上海时间 03:00（备份）
  "0 20 * * *",   # 每天 UTC 20:00 = 上海时间 04:00（清理日志）
]

# ★KV 缓存绑定（KV：全球同步的高速 key-value 缓存）
[[kv_namespaces]]
binding = "YIQUANTEA_KV"
id = "你的 KV namespace ID"

# ★D1 数据库绑定（D1：Cloudflare 自带的轻量 SQLite 数据库，仅存分析快照）
[[d1_databases]]
binding = "YIQUANTEA_D1"
database_name = "yiquantea-d1"
database_id = "你的 D1 database ID"

# ★R2 文件存储绑定（R2：存图片/视频/备份的对象存储）
[[r2_buckets]]
binding = "YIQUANTEA_R2"
bucket_name = "yiquantea-assets"

# ★环境变量（非敏感值可以直接写这里）
[vars]
NEXT_PUBLIC_SITE_URL = "https://yiquantea.com"
RATE_LIMIT_PUBLIC = "60"
RATE_LIMIT_LOGIN = "5"
BACKUP_RETENTION_DAYS = "7"

# ★密钥（不在代码里写死，通过 Cloudflare 后台设置）
# AUTH_SECRET、DATABASE_URL、RESEND_API_KEY 等通过 `wrangler secret put` 设置
